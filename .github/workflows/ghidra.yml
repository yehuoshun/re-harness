name: ghidra-headless

# 逆向分析执行台：Ghidra headless 反编译。
# 本仓库 public（免费 runner 4vCPU/16G），所以产物一律【加密】后作为 artifact 上传，
# 由沙箱侧解密再入语雀。明文产物绝不落到公开 artifact。
#
# 样本投递：老板手动上传到 `samples` 分支（不进 main 历史），
# 分析成功 → 删除 samples 分支并重建空白分支（彻底清掉样本）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 编译测试二进制；analyze = 下载 binary_url；in-repo = 分析 samples 分支里的样本"
        type: choice
        options: [smoke, analyze, in-repo]
        default: in-repo
      sample_path:
        description: "in-repo：样本在 samples 分支里的路径（留空 = 自动取唯一的文件）"
        type: string
        required: false
        default: ""
      binary_url:
        description: "analyze 模式：目标下载直链（海外源可加 https://gh-proxy.com/ 前缀）"
        type: string
        required: false
        default: ""
      binary_name:
        description: "保存文件名，如 target.dll（in-repo 留空即用样本原名）"
        type: string
        required: false
        default: ""
      ghidra_version:
        description: "Ghidra 版本"
        type: string
        required: false
        default: "12.1.4"
      max_functions:
        description: "最多反编译函数数（0 = 全部，慎用）"
        type: string
        required: false
        default: "50"
      maxmem:
        description: "Ghidra JVM 堆上限（必须封顶）"
        type: string
        required: false
        default: "4g"

permissions:
  contents: write   # 分析完成后需要删/重建 samples 分支

jobs:
  analyze:
    runs-on: ubuntu-24.04   # 固定版本：ubuntu-latest 2026-10-19 起迁 Ubuntu 26，避免环境漂移
    timeout-minutes: 90
    env:
      GHIDRA_VERSION: ${{ inputs.ghidra_version }}
      GHIDRA_DIR: ${{ github.workspace }}/.tool/ghidra
      OUT_DIR: ${{ github.workspace }}/out
      # 注意：Ghidra 工程路径不允许以 '.' 开头的路径段
      PROJECT_DIR: ${{ github.workspace }}/ghidra_proj
      BINARY_NAME: ${{ inputs.binary_name }}
      BINARY_URL: ${{ inputs.binary_url }}
      MODE: ${{ inputs.mode }}
      SAMPLE_PATH: ${{ inputs.sample_path }}
      MAX_FUNCTIONS: ${{ inputs.max_functions }}
      MAXMEM: ${{ inputs.maxmem }}
      RE_BUNDLE_PASS: ${{ secrets.RE_BUNDLE_PASS }}

    steps:
      - name: 环境自检（内存 / 磁盘）
        run: |
          echo "runner: $(nproc) vCPU / $(free -h | awk '/^Mem:/{print $2}') RAM / $(df -h / | awk 'NR==2{print $4}') free disk"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 计算目标文件名
        run: |
          if [ -z "${BINARY_NAME}" ]; then
            if [ "${MODE}" = "in-repo" ]; then
              # 从 samples 分支推断（SAMPLE_PATH 为空时取唯一文件）
              git fetch --depth=1 origin samples
              P="${SAMPLE_PATH:-$(git ls-tree -r --name-only origin/samples | grep -vE '(^|)/\.' | grep -viE '(^|/)README' | head -1)}"
            else
              P="${BINARY_URL##*/}"
              P="${P%%\?*}"
            fi
          else
            P="${BINARY_NAME}"
          fi
          echo "TARGET=${GITHUB_WORKSPACE}/target/${P}" >> "$GITHUB_ENV"
          echo "目标文件名: ${P}"

      - name: 缓存 Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: .tool
          key: ghidra-${{ inputs.ghidra_version }}-${{ runner.os }}

      - name: 安装 Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: bash scripts/install-ghidra.sh

      - name: 取目标物
        run: bash scripts/fetch-target.sh

      - name: Ghidra headless 分析
        run: bash scripts/run-ghidra.sh

      - name: 打包并加密产物
        if: always()
        run: |
          if [ ! -d out ]; then echo "⚠️ 无 out/（分析未产出，跳过打包）"; exit 0; fi
          pip install --quiet cryptography
          mkdir -p bundle
          python3 scripts/bundle.py pack out bundle/re-bundle.enc
          ls -lh bundle/

      - name: 产物摘要（只打印统计，不打内容）
        if: always()
        run: |
          echo "### 分析摘要"
          [ -f out/summary.txt ] && cat out/summary.txt || echo "无 summary"
          echo ""
          echo "decompiled.c 行数: $(wc -l < out/decompiled.c 2>/dev/null || echo 0)"
          echo "strings 条数: $(wc -l < out/strings.txt 2>/dev/null || echo 0)"

      - name: 上传加密产物（artifact 里只有密文）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-bundle-${{ github.run_number }}
          path: bundle/re-bundle.enc
          retention-days: 3
          if-no-files-found: warn

      # 只在分析成功后才清样本；失败保留，方便重试
      - name: 清样本（删 samples 分支并重建）
        if: ${{ success() && inputs.mode == 'in-repo' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cleanup-sample.sh

      - name: 清理 runner 上的明文（目标物 + 明文产物）
        if: always()
        run: |
          rm -rf "$OUT_DIR" "$TARGET" "$TARGET.sha256" "$GITHUB_WORKSPACE/ghidra_proj" "$GITHUB_WORKSPACE/target" 2>/dev/null || true
