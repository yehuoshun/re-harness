name: wayback-bulk

# 通用批量抓 web.archive.org 快照（本机被墙时用 runner 出口）
# 输入 urls：wayback replay URL 列表（逗号分隔，形如 https://web.archive.org/web/<ts>id_/http://...）
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "wayback replay URL 列表，逗号分隔"
        required: true
      artifact:
        description: "artifact 名称"
        required: false
        default: "wayback-bulk-out"
      delay:
        description: "每页间隔秒数"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: fetch
        env:
          URLS: ${{ inputs.urls }}
          DELAY: ${{ inputs.delay }}
        run: |
          python3 -u - <<'PY'
          import os, re, time, urllib.request, urllib.error, json, hashlib
          os.makedirs("out", exist_ok=True)
          urls = [u.strip() for u in os.environ["URLS"].split(",") if u.strip()]
          delay = float(os.environ.get("DELAY") or 1)
          UA = {"User-Agent": "Mozilla/5.0 (wayback-bulk)"}
          meta = []
          for i, u in enumerate(urls):
              ok, data, fin = False, None, None
              for t in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120) as r:
                          data = r.read(); fin = r.geturl(); ok = True
                      break
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504, 520, 522):
                          time.sleep(8 * (t + 1)); continue
                      break
                  except Exception:
                      time.sleep(8 * (t + 1))
              m = re.search(r"/web/([0-9]+[a-z_]*)/", u)
              ts = m.group(1) if m else "?"
              orig = re.sub(r"^https?://web\.archive\.org/web/[0-9]+[a-z_]*/", "", u)
              if ok:
                  ext = "htm"
                  mm = re.search(r"\.([a-zA-Z0-9]{2,5})(?:\?|$)", orig)
                  if mm: ext = mm.group(1).lower()
                  name = f"{i:04d}-{ts}-{hashlib.md5(orig.encode())[:10].hexdigest()}.{ext}"
                  open(f"out/{name}", "wb").write(data)
                  meta.append({"i": i, "ts": ts, "url": orig, "file": name, "size": len(data), "final": fin})
                  print(f"ok {i} {orig[:80]} {len(data)}", flush=True)
              else:
                  meta.append({"i": i, "ts": ts, "url": orig, "file": None})
                  print(f"FAIL {i} {orig[:80]}", flush=True)
              time.sleep(delay)
          json.dump(meta, open("out/manifest.json", "w"), ensure_ascii=False, indent=1)
          print("DONE ok", sum(1 for x in meta if x["file"]), "of", len(meta), flush=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: out/
          retention-days: 7
          if-no-files-found: error
